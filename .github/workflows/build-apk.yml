name: Build Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, integration/aax-web-api]
permissions:
  contents: read

# Keep only the newest build for each branch; commits in a batch cancel stale runs.
concurrency:
  group: aax-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run unit tests and build native APK
        run: gradle test assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" app/build/outputs/apk/debug/AAX.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
      - uses: actions/upload-artifact@v6
        with:
          name: AAX-Android
          path: app/build/outputs/apk/debug/AAX.apk
          retention-days: 30

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run Compose UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: gradle connectedDebugAndroidTest
