name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Add Maven Central mirror to Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("android").rglob("*"):
              if p.is_file() and p.suffix in (".gradle", ".kts"):
                  try:
                      s = p.read_text()
                  except Exception:
                      continue
                  if "mavenCentral()" in s:
                      s = s.replace("mavenCentral()", "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }; mavenCentral()")
                      p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verify APK signature and package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: academia-alius-x-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
